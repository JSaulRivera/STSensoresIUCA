<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualización de Datos</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.29/"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script src="init.js"></script>
  <style>
    body {
      font-family: "Orbitron", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0a0f1e;
      color: #00eaff;
    }

    h1#elemento {
      text-align: center;
      background: linear-gradient(to right, #001a33, #003366);
      padding: 20px;
      margin: 0;
      font-size: 24px;
      color: #00ffff;
      box-shadow: 0 0 15px #00eaff44;
    }

    .main-content {
      display: flex;
      flex-direction: row;
      padding: 20px;
      gap: 20px;
    }

    .atributosPanel {
      flex: 1;
      background: rgba(0, 30, 60, 0.3);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 204, 255, 0.2);
      backdrop-filter: blur(4px);
    }

    .atributosPanel table {
      width: 100%;
      border-collapse: collapse;
    }

    .atributosPanel td {
      padding: 8px;
      border: 1px solid #00aaff33;
    }

    #grafica {
      flex: 2;
      background: rgba(0, 30, 60, 0.3);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 204, 255, 0.3);
      backdrop-filter: blur(6px);
      height: 500px;
      display: flex;
      flex-direction: column;
    }

    canvas#lineChart {
      flex: 1;
      height: 100% !important;
      max-height: 400px;
    }

    select {
      background-color: #001f33;
      color: #00eaff;
      border: 1px solid #00ffff55;
      padding: 5px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-family: "Orbitron", sans-serif;
    }

    label {
      margin-bottom: 5px;
      display: block;
    }
  </style>
</head>

<body>
  <h1 id="elemento">Sensor</h1>

  <div class="main-content">
    <div class="atributosPanel">
      <table>
        <tr>
          <td class="title">Registro actual</td>
        </tr>
        <tr>
          <td>
            <table class="tableAttr">
              <tr>
                <td>Sensor</td>
                <td id="nombre">N/A</td>
              </tr>
              <tr>
                <td>Valor registrado</td>
                <td id="valorRegistrado">N/A</td>
              </tr>
              <tr>
                <td>Fecha de Registro</td>
                <td id="fechaRegistro">N/A</td>
              </tr>
              <tr>
                <td>Tipo de sensor</td>
                <td id="tipo">N/A</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
      <div id="modeloContainer" style="margin-top: 20px; text-align: center;">
        <model-viewer id="modeloGLB" src="" alt="Modelo 3D" auto-rotate camera-controls
          style="width: 100%; height: 300px; background-color: #001f33; border-radius: 10px;">
        </model-viewer>
      </div>
    </div>

    <div id="grafica">
      <label for="opciones">Elige un rango:</label>
      <select id="opciones">
        <option value="opcion1">Última hora</option>
        <option value="opcion2">Último día</option>
        <option value="opcion3">Última semana</option>
      </select>
      <canvas id="lineChart"></canvas>
    </div>
  </div>

  <script src="datos.js"></script>
</body>

</html>
